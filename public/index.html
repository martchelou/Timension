<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <base href="/">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="shortcut icon" href="./img/smartwatch.svg" type="image/svg+xml">
    <link rel="stylesheet" href="./css/style.min.css">

    <script defer src="./js/main.min.js"></script>

    <title>Relógio Timension</title>
</head>
<body>
    <header>
        <div class="container">
            <h1>Relógio Timension</h1>
        </div>
    </header>
    <main>
        <div class="container">
            <div class="watch">
                <div class="seconds"></div>
                <div class="minutes"></div>
                <div class="hours"></div>
                <div class="time">{{Hans Donner watch Time}}</div>
            </div>
        </div>
    </main>
    <footer>
        <div class="container">
            <p id="date" class="m-0">{{Year}}</p>
            <nav>
                <a 
                    title="code source on github"
                    href="https://github.com/martchelou/Timension" target="_blank" class="btn">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-git" viewBox="0 0 16 16">
                        <path d="M15.698 7.287 8.712.302a1.03 1.03 0 0 0-1.457 0l-1.45 1.45 1.84 1.84a1.223 1.223 0 0 1 1.55 1.56l1.773 1.774a1.224 1.224 0 0 1 1.267 2.025 1.226 1.226 0 0 1-2.002-1.334L8.58 5.963v4.353a1.226 1.226 0 1 1-1.008-.036V5.887a1.226 1.226 0 0 1-.666-1.608L5.093 2.465l-4.79 4.79a1.03 1.03 0 0 0 0 1.457l6.986 6.986a1.03 1.03 0 0 0 1.457 0l6.953-6.953a1.03 1.03 0 0 0 0-1.457"/>
                    </svg>
                </a>
            </nav>
        </div>
    </footer>    
</body>
</html>
