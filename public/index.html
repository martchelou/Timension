<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <base href="/">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="shortcut icon" href="./img/smartwatch.svg" type="image/svg+xml">
    <link rel="stylesheet" href="./css/style.min.css">

    <script defer src="./js/main.min.js"></script>

    <title>Relógio Timension</title>
</head>
<body>
    <header>
        <div class="container">
            <h1>Relógio Timension</h1>
        </div>
    </header>
    <main>
        <div class="container">
            <div class="watch">
                <div class="seconds"></div>
                <div class="minutes"></div>
                <div class="hours"></div>
                <div class="time">{{Hans Donner watch Time}}</div>
            </div>
        </div>
    </main>
    <footer>
        <div class="container">
            <p id="date" class="m-0">{{Year}}</p>
        </div>
    </footer>    
</body>
</html>
